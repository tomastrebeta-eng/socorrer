<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SOCORRER · CRM de cursos</title>
<meta name="description" content="CRM de cursos de primeros auxilios, RCP y DEA: grupos, cursos, vencimientos y pagos.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17948F">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SOCORRER">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F4F3EE;
    --surface: #FFFFFF;
    --surface-2: #ECEAE2;
    --ink: #1C2B2E;
    --ink-soft: #5B6764;
    --border: #DEDBD0;
    --brand: #17948F;
    --brand-dark: #117A76;
    --brand-soft: #DCEEEC;
    --coral: #E97A5C;
    --coral-soft: #FBE5DD;
    --red: #B4392B;
    --red-soft: #F4E1DC;
    --amber: #B5791E;
    --amber-soft: #F5E7CE;
    --green: #276E52;
    --green-soft: #DCEAE1;
    --blue: #2E5C8A;
    --blue-soft: #DEE7F0;
    --grey: #8A8577;
    --grey-soft: #E8E6DD;
    --radius: 10px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --shadow: 0 1px 2px rgba(28,43,46,0.06), 0 4px 16px rgba(28,43,46,0.06);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #14201F;
      --surface: #1B2827;
      --surface-2: #223231;
      --ink: #EDEEE6;
      --ink-soft: #A3ADA8;
      --border: #2E403E;
      --brand-soft: #163531;
      --coral-soft: #3A2B22;
      --red-soft: #3A2420;
      --amber-soft: #3A2E17;
      --green-soft: #1C332A;
      --blue-soft: #1D2C3A;
      --grey-soft: #26332F;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14201F;
    --surface: #1B2827;
    --surface-2: #223231;
    --ink: #EDEEE6;
    --ink-soft: #A3ADA8;
    --border: #2E403E;
    --brand-soft: #163531;
    --coral-soft: #3A2B22;
    --red-soft: #3A2420;
    --amber-soft: #3A2E17;
    --green-soft: #1C332A;
    --blue-soft: #1D2C3A;
    --grey-soft: #26332F;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 20px rgba(0,0,0,0.35);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  h1, h2, h3, .display { font-family: var(--font-display); letter-spacing: -0.01em; }
  button { font-family: inherit; }
  #app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 4px 8px 20px;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.01em;
  }
  .brand-mark {
    width: 30px; height: 30px;
    flex-shrink: 0;
  }
  .brand-mark img { width: 100%; height: 100%; display: block; }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px;
    border-radius: 8px;
    color: var(--ink-soft);
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    border: none;
    background: none;
    text-align: left;
    width: 100%;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item.active { background: var(--brand-soft); color: var(--brand-dark); }
  .nav-item .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .0; }
  .nav-spacer { flex: 1; }
  .sidebar-foot {
    font-size: 11.5px; color: var(--ink-soft); padding: 10px 8px 2px;
    border-top: 1px solid var(--border); margin-top: 10px; line-height: 1.5;
  }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    position: sticky; top: 0; z-index: 5;
    padding-top: calc(16px + env(safe-area-inset-top, 0px));
  }
  .topbar h1 { font-size: 19px; margin: 0; font-weight: 600; }
  .topbar .sub { font-size: 12.5px; color: var(--ink-soft); margin-top: 1px; }
  .topbar-spacer { flex: 1; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-size: 13.5px; font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  .btn-primary:hover { background: var(--brand-dark); }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-ghost:hover { background: var(--surface-2); }
  .btn-sm { padding: 6px 10px; font-size: 12.5px; }
  .btn-danger-text { color: var(--red); }
  .search-box {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg);
    min-width: 220px;
  }
  .search-box input {
    border: none; background: transparent; outline: none; font-size: 13.5px;
    color: var(--ink); width: 100%; font-family: inherit;
  }
  .view-root { padding: 22px 24px 60px; overflow-x: auto; }

  /* ---------- KPI cards ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 22px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px 18px;
  }
  .kpi-card .label { font-size: 12px; color: var(--ink-soft); font-weight: 500; }
  .kpi-card .value { font-family: var(--font-display); font-size: 28px; font-weight: 700; margin-top: 6px; }
  .kpi-card .value.alert { color: var(--red); }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 20px; overflow: hidden;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .panel-head h2 { font-size: 14.5px; margin: 0; font-weight: 600; }
  .panel-body { padding: 4px 0; }
  .empty-state { padding: 30px 18px; text-align: center; color: var(--ink-soft); font-size: 13.5px; }

  /* ---------- Lists / rows ---------- */
  .row-list { display: flex; flex-direction: column; }
  .list-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .list-row:last-child { border-bottom: none; }
  .list-row:hover { background: var(--surface-2); }
  .row-main { flex: 1; min-width: 0; }
  .row-title { font-size: 14px; font-weight: 500; }
  .row-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }

  .badge {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 9px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600;
    white-space: nowrap;
  }
  .badge-red { background: var(--red-soft); color: var(--red); }
  .badge-amber { background: var(--amber-soft); color: var(--amber); }
  .badge-green { background: var(--green-soft); color: var(--green); }
  .badge-blue { background: var(--blue-soft); color: var(--blue); }
  .badge-grey { background: var(--grey-soft); color: var(--grey); }

  /* ---------- Table (grupos) ---------- */
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 720px; }
  table.data-table th {
    text-align: left; font-size: 11.5px; text-transform: none; font-weight: 600;
    color: var(--ink-soft); padding: 10px 16px; border-bottom: 1px solid var(--border);
  }
  table.data-table td { padding: 12px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.data-table tbody tr { cursor: pointer; }
  table.data-table tbody tr:hover { background: var(--surface-2); }
  table.data-table tbody tr:last-child td { border-bottom: none; }
  .filters-row { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  select, input[type=text], input[type=number], input[type=date], textarea {
    font-family: inherit; font-size: 13.5px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
    padding: 9px 11px; outline: none; width: 100%;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--brand); }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }
  .filters-row select { width: auto; min-width: 140px; }

  /* ---------- Detail view ---------- */
  .detail-header {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 20px; margin-bottom: 18px;
  }
  .detail-header-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .detail-title { font-size: 21px; font-weight: 700; margin: 0 0 6px; }
  .detail-meta { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .info-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 18px; }
  .info-item .k { font-size: 11px; color: var(--ink-soft); font-weight: 500; margin-bottom: 3px; }
  .info-item .v { font-size: 13.5px; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
  .tab-btn {
    padding: 10px 4px; margin-right: 18px; border: none; background: none; cursor: pointer;
    font-size: 13.5px; font-weight: 500; color: var(--ink-soft); border-bottom: 2px solid transparent;
    font-family: inherit;
  }
  .tab-btn.active { color: var(--ink); border-bottom-color: var(--brand); }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,26,25,0.45);
    display: flex; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 50;
  }
  .modal {
    background: var(--surface); border-radius: 14px; width: 100%; max-width: 480px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .modal-head { padding: 18px 20px 4px; display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 16.5px; }
  .modal-close { background: none; border: none; cursor: pointer; color: var(--ink-soft); font-size: 18px; padding: 4px; }
  .modal-body { padding: 14px 20px 20px; display: flex; flex-direction: column; gap: 13px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-soft); margin-bottom: 5px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .hint { font-size: 11.5px; color: var(--ink-soft); margin-top: 3px; }
  .hint.warn { color: var(--red); }

  .banner {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 24px; font-size: 12.5px; background: var(--amber-soft); color: var(--amber);
    border-bottom: 1px solid var(--border);
  }

  .note-item { padding: 12px 18px; border-bottom: 1px solid var(--border); }
  .note-item:last-child { border-bottom: none; }
  .note-date { font-size: 11px; color: var(--ink-soft); margin-bottom: 3px; }
  .note-text { font-size: 13.5px; line-height: 1.5; white-space: pre-wrap; }

  #menuToggle { display: none; }
  .sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(20,26,25,0.45); z-index: 39; }
  .sidebar-backdrop.show { display: block; }
  @media (max-width: 820px) {
    #menuToggle { display: inline-flex; align-items: center; justify-content: center; font-size: 18px; }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.25); padding-top: calc(16px + env(safe-area-inset-top, 0px)); }
    .sidebar.open { transform: translateX(0); }
    .kpi-row { grid-template-columns: 1fr 1fr; }
    .info-grid { grid-template-columns: 1fr 1fr; }
    .field-row { grid-template-columns: 1fr; }
    .view-root { padding: 16px; }
    .topbar { padding: 14px 16px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); gap: 10px; }
  }
  @media (max-width: 560px) {
    .kpi-row { grid-template-columns: 1fr; }
    .info-grid { grid-template-columns: 1fr; }
    .filters-row { flex-wrap: wrap; }
    .filters-row .search-box { max-width: none; }
  }
  .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #16a34a; display: inline-block; box-shadow: 0 0 6px rgba(22,163,74,.7); transition: all .3s; vertical-align: middle; flex: none; }
  .sync-dot.syncing { background: #d97706; box-shadow: 0 0 6px rgba(217,119,6,.7); animation: syncPulse .8s infinite; }
  .sync-dot.offline { background: #dc2626; box-shadow: 0 0 6px rgba(220,38,38,.7); animation: none; }
  .sync-label { font-size: .72rem; color: var(--muted, #6b7280); margin: 0 4px 0 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  @keyframes syncPulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  .wa-btn { display: inline-flex; align-items: center; gap: 5px; background: #25D366; color: #fff; border-radius: 999px; padding: 4px 11px; font-size: 11.5px; font-weight: 600; text-decoration: none; line-height: 1; vertical-align: middle; transition: background .15s, transform .1s; white-space: nowrap; }
  .wa-btn:hover { background: #1ebe5b; }
  .wa-btn:active { transform: scale(.96); }
  .wa-btn svg { width: 13px; height: 13px; fill: #fff; flex: none; }
  .wa-btn.wa-inline { padding: 3px; border-radius: 50%; }
  .contacto-cell { display: inline-flex; align-items: center; gap: 8px; }
  .tel-line { display: inline-flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .modal.wide { max-width: 680px; }
  .ins-sub { font-size: 12.5px; color: var(--ink-soft); margin-bottom: 10px; }
  .ins-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  .ins-drop { border: 1.5px dashed var(--border); border-radius: 10px; padding: 12px; font-size: 12px; color: var(--ink-soft); text-align: center; cursor: pointer; transition: .15s; margin-bottom: 8px; }
  .ins-drop.drag { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); }
  .ins-summary { font-size: 12.5px; color: var(--ink-soft); margin: 2px 0 8px; }
  .ins-list { max-height: 46vh; overflow: auto; border: 1px solid var(--border); border-radius: 10px; }
  .ins-head, .ins-row { display: grid; grid-template-columns: 1.2fr 1.2fr 100px 46px 30px; gap: 6px; align-items: center; padding: 6px 8px; }
  .ins-head { position: sticky; top: 0; background: var(--surface-2); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-soft); font-weight: 600; z-index: 1; }
  .ins-row { border-top: 1px solid var(--border); }
  .ins-row input[type=text] { width: 100%; padding: 5px 7px; font-size: 12.5px; }
  .ins-head .pres, .ins-row .pres { display: flex; justify-content: center; }
  .ins-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 14px; padding: 2px; }
  .app-toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow); z-index: 100; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); text-align: center; }
  .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .app-toast.error { background: var(--red); }
  @media (max-width: 560px) {
    .ins-head, .ins-row { grid-template-columns: 1fr 1fr 78px 40px 26px; gap: 4px; padding: 6px; }
    .ins-tools .btn { flex: 1 1 auto; }
  }
</style>
</head>

  function fmtMoney(n){ n = Number(n)||0; return "$" + n.toLocaleString("es-AR",{maximumFractionDigits:0}); }

  function setSyncing(){
    const dot = document.getElementById("syncDot");
    const lbl = document.getElementById("syncLabel");
    if (!navigator.onLine) { setOffline(); return; }
    if (dot) dot.className = "sync-dot syncing";
    if (lbl) lbl.textContent = "sincronizando…";
    clearTimeout(setSyncing._t);
    setSyncing._t = setTimeout(setOnline, 1200);
  }
  function setOffline(){
    const dot = document.getElementById("syncDot");
    const lbl = document.getElementById("syncLabel");
    if (dot) dot.className = "sync-dot offline";
    if (lbl) lbl.textContent = "sin conexión";
  }
  window.addEventListener("online", setOnline);
  window.addEventListener("offline", setOffline);

  /* ============ Capa de datos (Firestore, misma API que usaba la app) ============ */
  let initialLoads = 0;
  const TOTAL_COLS = 4;

  async function initDb(){
    try {
      const app = initializeApp(firebaseConfig);
      fdb = getFirestore(app);
    } catch(e){ console.error(e); fdb = null; }
    state.dbReady = !!fdb;
    if (fdb) {
      if (!navigator.onLine) setOffline(); else setOnline();
      subscribe(makeQuery("grupos","createdAt","desc"), docs => { state.grupos = docs; state.loading = false; markLoaded(); render(); });
      subscribe(makeQuery("cursos","fecha","desc"), docs => { state.cursos = docs; markLoaded(); render(); });
      subscribe(makeQuery("pagos","fecha","desc"), docs => { state.pagos = docs; markLoaded(); render(); });
      subscribe(makeQuery("notas","fecha","desc"), docs => { state.notas = docs; markLoaded(); render(); });
    } else {
      state.loading = false;
      renderBanner();
      render();
    }
  }

  // Los primeros snapshots son la carga inicial; los siguientes son cambios → "sincronizando".
  function markLoaded(){
    if (initialLoads < TOTAL_COLS) initialLoads++;
    else setSyncing();
  }

  // Construye un objeto tipo "query" con onSnapshot y fallback sin orderBy.
  function makeQuery(name, sortField, sortDir){
    return {
      onSnapshot(cb, errCb){
        let q;
        try { q = sortField ? query(collection(fdb, fcol(name)), orderBy(sortField, sortDir || "asc")) : collection(fdb, fcol(name)); }
        catch(e){ q = collection(fdb, fcol(name)); }
        return onSnapshot(q, cb, e => {
          // Si falla por falta de índice/campo, reintenta sin ordenar.
          if (sortField) { onSnapshot(collection(fdb, fcol(name)), cb, errCb || (()=>{})); }
          else if (errCb) errCb(e);
          else console.error(e);
        });
      }
    };
  }

  function subscribe(q, cb){
    q.onSnapshot(
      snap => cb(snap.docs.map(d => ({ id: d.id, ...d.data() }))),
      err => { console.error(err); }
    );
  }

  async function createDoc(col, data){
    if (fdb) {
      setSyncing();
      const ref = await addDoc(collection(fdb, fcol(col)), data);
      return ref.id;
    }
    const id = genId();
    const withId = { id, ...data };
    state[col].unshift(withId);
    render();
    return id;
  }

  async function updateDoc(col, id, data){
    if (fdb) {
      setSyncing();
      await fbUpdateDoc(doc(fdb, fcol(col), id), data);
    } else {
      const item = state[col].find(x => x.id === id);
      if (item) Object.assign(item, data);
      render();
    }
  }

  }

  function renderBanner(){
    const el = document.getElementById("banner");
    if (!state.dbReady) {
      el.innerHTML = '<div class="banner">⚠ Esta vista no tiene almacenamiento persistente conectado: los datos que cargues acá no se guardarán al cerrar la página.</div>';
    } else {
      el.innerHTML = "";
    }
  }

  function render(){
    renderBanner();
    document.querySelectorAll(".nav-item").forEach(b => b.classList.toggle("active", b.dataset.nav === state.view));
    const root = document.getElementById("viewRoot");
    if (state.loading) { root.innerHTML = '<div class="empty-state">Cargando…</div>'; return; }
    if (state.view === "dashboard") return renderDashboard(root);
    if (state.view === "grupos") return renderGrupos(root);
    if (state.view === "vencimientos") return renderVencimientos(root);
    if (state.view === "pagos") return renderPagos(root);
    if (state.view === "grupoDetail") return renderGrupoDetail(root);
  }

    const gruposActivos = state.grupos.filter(g => g.estado === "activo").length;
    const gruposProspecto = state.grupos.filter(g => ["prospecto","contactado","cotizado","agendado"].includes(g.estado)).length;

    const cursosRealizados = state.cursos.filter(c => c.estado === "realizado");
    const porVencer = cursosRealizados.filter(c => { const d = daysUntil(c.vencimiento); return d <= 60; })
      .sort((a,b) => daysUntil(a.vencimiento) - daysUntil(b.vencimiento));

    const pagosPendientes = state.pagos.filter(p => p.estado === "pendiente");

  // Normaliza un teléfono a formato wa.me. Por defecto asume celular argentino
  // sin código de país: antepone 54 9 y quita el 15 de celular si viene cargado.
  function waDigits(raw){
    if (!raw) return "";
    let d = String(raw).replace(/\D/g, "");
    if (!d) return "";
    d = d.replace(/^00/, "");                       // prefijo internacional 00
    if (d.startsWith("54")) {                        // ya trae código de país
      let rest = d.slice(2).replace(/^0/, "");
      if (!rest.startsWith("9")) rest = "9" + rest.replace(/^(\d{2,4})15(\d{6,8})$/, "$1$2");
      d = "54" + rest;
    } else {
      d = d.replace(/^0/, "");                        // quita 0 de larga distancia
      d = d.replace(/^(\d{2,4})15(\d{6,8})$/, "$1$2"); // quita 15 de celular tras el área
      d = "549" + d;
    }
    return d.length >= 10 ? d : "";

  /* ============ Inscriptos / Asistencia ============ */
  function inscriptosDe(c){ return Array.isArray(c.inscriptos) ? c.inscriptos : []; }
  function presentesDe(c){ return inscriptosDe(c).filter(p => p.presente).length; }
  function attendeeSummary(c){
    const ins = inscriptosDe(c);
    if (ins.length) return presentesDe(c) + "/" + ins.length + " presentes";
    return (c.asistentes || 0) + " asistentes";
  }
  function cleanInscripto(p){
    return { id: p.id || genId(), apellido: (p.apellido||"").trim(), nombre: (p.nombre||"").trim(), dni: (p.dni||"").trim(), presente: !!p.presente };
  }
  function slug(s){ return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,40) || "sin-nombre"; }

  // Carga SheetJS solo cuando hace falta (import/export). Vendorizado local para que ande offline.
  let _xlsxPromise = null;
  function ensureXLSX(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (_xlsxPromise) return _xlsxPromise;
    _xlsxPromise = new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "xlsx.full.min.js";
      s.onload = () => resolve(window.XLSX);
      s.onerror = () => { _xlsxPromise = null; reject(new Error("No se pudo cargar la librería de Excel")); };
      document.head.appendChild(s);
    });
    return _xlsxPromise;
  }
  function normTxt(s){ return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim(); }

  // Convierte filas (array de arrays) a inscriptos, detectando encabezados Apellido/Nombre/DNI.
  function rowsToInscriptos(rows){
    if (!rows || !rows.length) return [];
    const header = rows[0].map(normTxt);
    let iAp = -1, iNo = -1, iDni = -1, iFull = -1;
    header.forEach((h, i) => {
      const hasNom = h.includes("nombre"), hasAp = h.includes("apellid");
      if (hasNom && hasAp && iFull < 0) iFull = i;
      else if (hasAp && iAp < 0) iAp = i;
      else if (hasNom && iNo < 0) iNo = i;
      if ((h.includes("dni") || h.includes("documento")) && iDni < 0) iDni = i;
    });
    const hasHeader = iAp >= 0 || iNo >= 0 || iDni >= 0 || iFull >= 0;
    const dataRows = hasHeader ? rows.slice(1) : rows;
    if (!hasHeader) { iAp = 0; iNo = 1; iDni = 2; }
    const out = [];
    dataRows.forEach(r => {
      if (!r || r.every(c => String(c).trim() === "")) return;
      let apellido = "", nombre = "", dni = "";
      if (iFull >= 0) {
        const v = String(r[iFull] || "").trim();
        if (v.includes(",")) { const p = v.split(","); apellido = p[0].trim(); nombre = p.slice(1).join(",").trim(); }
        else { nombre = v; apellido = ""; }
      } else {
        apellido = iAp >= 0 ? String(r[iAp] || "").trim() : "";
        nombre = iNo >= 0 ? String(r[iNo] || "").trim() : "";
      }
      dni = iDni >= 0 ? String(r[iDni] || "").replace(/[^\dkK]/g, "") : "";
      if (!apellido && !nombre && !dni) return;
      out.push({ id: genId(), apellido, nombre, dni, presente: false });
    });
    return out;
  }

  async function parseInscriptosFile(file){
    const XLSX = await ensureXLSX();
    const buf = await file.arrayBuffer();
    const wb = XLSX.read(buf, { type: "array" });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
    return rowsToInscriptos(rows);
  }

  function modalAsistencia(cursoId){
    const curso = state.cursos.find(c => c.id === cursoId);
    if (!curso) return;
    const grupo = state.grupos.find(g => g.id === curso.grupoId);
    let ins = inscriptosDe(curso).map(cleanInscripto);

    openModal(
      '<div class="modal-head"><h3>Asistencia — ' + escapeHtml(curso.tipoCurso) + '</h3><button class="modal-close" data-close>✕</button></div>' +
      '<div class="modal-body">' +
        '<div class="ins-sub">' + fmtDate(curso.fecha) + (grupo ? " · " + escapeHtml(grupo.nombre) : "") + '</div>' +
        '<div class="ins-tools">' +
          '<label class="btn btn-sm" style="cursor:pointer">📥 Importar xlsx/csv<input type="file" id="insFile" accept=".xlsx,.xls,.csv" hidden></label>' +
          '<button class="btn btn-sm" id="insPlantilla" type="button">Descargar plantilla</button>' +
          '<button class="btn btn-sm" id="insAdd" type="button">+ Agregar persona</button>' +
          '<button class="btn btn-sm btn-green" id="insExport" type="button">⬇ Exportar presentes (Excel)</button>' +
        '</div>' +
        '<div class="ins-drop" id="insDrop">Arrastrá acá un archivo .xlsx o .csv (columnas: Apellido, Nombre, DNI)</div>' +
        '<div class="ins-summary" id="insSummary"></div>' +
        '<div class="ins-list" id="insList"></div>' +
        '<div class="modal-actions"><button class="btn" data-close>Cerrar</button><button class="btn btn-primary" id="insSave">Guardar asistencia</button></div>' +
      '</div>',
      "wide"
    );
    wireCloseButtons();

    const listEl = document.getElementById("insList");
    const sumEl = document.getElementById("insSummary");

    function readRows(){
      const rows = listEl.querySelectorAll(".ins-row");
      const next = [];
      rows.forEach(row => {
        next.push({
          id: row.dataset.id,
          apellido: row.querySelector(".ins-ap").value,
          nombre: row.querySelector(".ins-no").value,
          dni: row.querySelector(".ins-dni").value,
          presente: row.querySelector(".ins-pres").checked,
        });
      });
      ins = next.map(cleanInscripto);
    }

    function renderList(){
      const total = ins.length;
      const pres = ins.filter(p => p.presente).length;
      sumEl.textContent = total ? (pres + " presentes de " + total + " inscriptos") : "Todavía no hay inscriptos. Importá un archivo o agregá personas.";
      let h = '<div class="ins-head"><span>Apellido</span><span>Nombre</span><span>DNI</span><span class="pres"><input type="checkbox" id="insAll" title="Marcar todos"></span><span></span></div>';
      ins.forEach(p => {
        h += '<div class="ins-row" data-id="' + p.id + '">' +
          '<input type="text" class="ins-ap" value="' + escapeHtml(p.apellido) + '" placeholder="Apellido">' +
          '<input type="text" class="ins-no" value="' + escapeHtml(p.nombre) + '" placeholder="Nombre">' +
          '<input type="text" class="ins-dni" value="' + escapeHtml(p.dni) + '" placeholder="DNI" inputmode="numeric">' +
          '<span class="pres"><input type="checkbox" class="ins-pres"' + (p.presente ? " checked" : "") + '></span>' +
          '<button type="button" class="ins-del" title="Quitar">✕</button>' +
        '</div>';
      });
      listEl.innerHTML = h;
      const all = document.getElementById("insAll");
      if (all) { all.checked = total > 0 && pres === total; all.addEventListener("change", () => { readRows(); ins.forEach(p => p.presente = all.checked); renderList(); }); }
      listEl.querySelectorAll(".ins-del").forEach(b => b.addEventListener("click", () => { readRows(); ins = ins.filter(x => x.id !== b.parentElement.dataset.id); renderList(); }));
      listEl.querySelectorAll(".ins-pres").forEach(cb => cb.addEventListener("change", () => { readRows(); renderList(); }));
    }
    renderList();

    document.getElementById("insAdd").addEventListener("click", () => {
      readRows();
      ins.push({ id: genId(), apellido: "", nombre: "", dni: "", presente: true });
      renderList();
      const rows = listEl.querySelectorAll(".ins-row");
      const last = rows[rows.length - 1];
      if (last) last.querySelector(".ins-ap").focus();
    });

    async function handleFile(file){
      if (!file) return;
      try {
        const nuevos = await parseInscriptosFile(file);
        if (!nuevos.length) { showToast("No se encontraron filas con datos en el archivo.", true); return; }
        readRows();
        ins = ins.concat(nuevos);
        renderList();
        showToast(nuevos.length + " persona(s) importada(s).");
      } catch (e) {
        console.error(e);
        showToast("No se pudo leer el archivo. ¿Está en formato xlsx o csv?", true);
      }
    }
    document.getElementById("insFile").addEventListener("change", e => { handleFile(e.target.files[0]); e.target.value = ""; });
    const drop = document.getElementById("insDrop");
    ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("drag"); }));
    ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("drag"); }));
    drop.addEventListener("drop", e => { if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); });
    drop.addEventListener("click", () => document.getElementById("insFile").click());

    document.getElementById("insPlantilla").addEventListener("click", () => {
      const csv = "Apellido,Nombre,DNI\n";
      const blob = new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "plantilla_inscriptos.csv"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    document.getElementById("insExport").addEventListener("click", async () => {
      readRows();
      const presentes = ins.filter(p => p.presente);
      if (!presentes.length) { showToast("No hay personas marcadas como presentes para exportar.", true); return; }
      try {
        const XLSX = await ensureXLSX();
        const aoa = [["Apellido","Nombre","DNI","Curso","Fecha","Grupo"]];
        presentes.forEach(p => aoa.push([p.apellido, p.nombre, p.dni, curso.tipoCurso, fmtDate(curso.fecha), grupo ? grupo.nombre : ""]));
        const ws = XLSX.utils.aoa_to_sheet(aoa);
        ws["!cols"] = [{ wch: 20 }, { wch: 20 }, { wch: 14 }, { wch: 22 }, { wch: 12 }, { wch: 24 }];
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Presentes");
        XLSX.writeFile(wb, "SOCORRER_" + slug(grupo ? grupo.nombre : "") + "_" + slug(curso.tipoCurso) + "_" + (curso.fecha || "") + "_presentes.xlsx");
      } catch (e) {
        console.error(e);
        showToast("No se pudo generar el Excel.", true);
      }
    });

    document.getElementById("insSave").addEventListener("click", async () => {
      readRows();
      const limpio = ins.map(cleanInscripto);
      await updateDoc("cursos", cursoId, { inscriptos: limpio, asistentes: limpio.filter(p => p.presente).length });
      closeModal();
      render();
    });
  }

  let _toastTimer = null;

    let t = document.getElementById("appToast");
    if (!t) { t = document.createElement("div"); t.id = "appToast"; document.body.appendChild(t); }
    t.textContent = msg;

  function wireCloseButtons(){

  /* ============ Delegación de eventos ============ */
  document.addEventListener("click", async (e) => {
    // El botón de WhatsApp es un enlace real: dejarlo abrir sin abrir el grupo.
    if (e.target.closest("[data-wa]")) return;

    const nav = e.target.closest("[data-nav]");
    if (nav) { state.view = nav.dataset.nav; closeDrawer(); render(); return; }

    const navTo = e.target.closest("[data-nav-to]");
    if (navTo) { state.view = navTo.dataset.navTo; render(); return; }

    const openGrupo = e.target.closest("[data-open-grupo]");
    if (openGrupo) { state.groupId = openGrupo.dataset.openGrupo; state.view = "grupoDetail"; state.detailTab = "cursos"; render(); return; }

    const tab = e.target.closest("[data-tab]");
    if (tab) { state.detailTab = tab.dataset.tab; render(); return; }

    const action = e.target.closest("[data-action]");
    if (action) {
      const act = action.dataset.action;
      if (act === "new-grupo") modalNewGrupo(null);
      if (act === "edit-grupo") modalNewGrupo(state.grupos.find(g => g.id === state.groupId));
      if (act === "new-curso") modalNewCurso(state.groupId);
      if (act === "new-pago") modalNewPago(state.groupId);
      if (act === "asistencia") modalAsistencia(action.dataset.id);
      if (act === "marcar-realizado") {
        const c = state.cursos.find(x => x.id === action.dataset.id);
        if (c) {
          const venc = addYears(c.fecha, c.validezAnios || 2);
          await updateDoc("cursos", c.id, { estado: "realizado", vencimiento: venc });
          const grp = state.grupos.find(x => x.id === c.grupoId);
          if (grp && ["prospecto","contactado","cotizado","agendado"].includes(grp.estado)) {
            await updateDoc("grupos", grp.id, { estado: "activo" });
          }
          render();
        }
      }
      if (act === "marcar-pagado") {
        await updateDoc("pagos", action.dataset.id, { estado: "pagado" });
        render();
      }
      if (act === "add-nota") {
        const txt = document.getElementById("notaTexto").value.trim();
        if (txt) {
          await createDoc("notas", { grupoId: state.groupId, texto: txt, fecha: todayISO(), createdAt: Date.now() });
          render();
        }
      }
      return;
    }
  });

  /* ============ Menú lateral en móvil ============ */
  function openDrawer(){
    document.getElementById("sidebar").classList.add("open");
    document.getElementById("sidebarBackdrop").classList.add("show");
  }
  function closeDrawer(){
    const sb = document.getElementById("sidebar");
    const bd = document.getElementById("sidebarBackdrop");
    if (sb) sb.classList.remove("open");
    if (bd) bd.classList.remove("show");
  }
  document.getElementById("menuToggle").addEventListener("click", () => {
    const open = document.getElementById("sidebar").classList.contains("open");
    open ? closeDrawer() : openDrawer();
  });
  document.getElementById("sidebarBackdrop").addEventListener("click", closeDrawer);

  /* ============ PWA: service worker (instalable + offline básico) ============ */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.warn("SW no registrado:", err));
    });
  }

  /* ============ Init ============ */
  render();
  initDb();
})();
</script>
</body>
</html>
